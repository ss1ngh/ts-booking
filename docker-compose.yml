services:
  #postgresql database
  postgres:
    image: postgres:16-alpine
    container_name: ts-booking-db
    environment:
      POSTGRES_USER: ${DB_USER:-shreyansh}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-ts_booking}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  #redis
  redis:
    image: redis:7-alpine
    container_name: ts-booking-cache
    command: ["redis-server", "--requirepass" ,"${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata: